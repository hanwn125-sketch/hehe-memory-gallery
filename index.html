<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>鹤鹤的记忆收藏馆</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="locked">
    <section class="auth-gate" id="auth-gate" aria-label="访问验证">
      <form class="auth-card" id="auth-form">
        <p class="eyebrow">Private Archive</p>
        <h1>鹤鹤的记忆收藏馆</h1>
        <p>这是只给你们看的影像空间。输入访问密码后，就可以打开时间线和照片墙。</p>
        <label>
          <span>访问密码</span>
          <input id="password-input" type="password" autocomplete="current-password" placeholder="输入密码" required />
        </label>
        <button class="primary-button" type="submit">进入相册</button>
        <small id="auth-error" role="alert"></small>
      </form>
    </section>

    <div class="site-shell" id="site-shell" aria-hidden="true">
      <header class="hero" id="hero">
        <nav class="topbar">
          <a class="brand" href="#top" aria-label="回到顶部">Time Album</a>
          <div class="nav-actions">
            <a href="#timeline">时间线</a>
            <a href="#upload">上传</a>
            <button id="lock-button" type="button">锁定</button>
          </div>
        </nav>
        <section class="hero-inner" id="top">
          <p class="eyebrow">小田和小韩</p>
          <h1>小田和小韩的时光纪念册</h1>
          <p class="hero-copy">把一起走过的日子，按时间收进一条可以慢慢翻看的轴里。</p>
        </section>
      </header>

      <main>
        <section class="section-head">
          <p class="eyebrow">Timeline</p>
          <h2>时间轴</h2>
          <p>横向滑动时间轴，点击任意合集进入照片墙。</p>
        </section>

        <section class="timeline" id="timeline" aria-label="时间线"></section>

        <section class="upload-panel" id="upload">
          <div>
            <p class="eyebrow">For Her</p>
            <h2>建立本地合集</h2>
            <p>选择图片后，会在当前浏览器里生成一个本地合集并加入时间轴。图片不会上传到 GitHub，也不会被别人看到。</p>
          </div>
          <form id="local-album-form" class="local-album-form">
            <input id="local-album-title" type="text" placeholder="合集名，例如：她的反击" required />
            <input id="local-album-date" type="date" />
            <input id="local-album-files" type="file" accept="image/*" multiple required />
            <button class="primary-button" type="submit">创建本地合集</button>
          </form>
        </section>

        <section class="toolbar gallery-panel" id="gallery" hidden>
          <div>
            <p class="eyebrow">Gallery</p>
            <h2>照片墙</h2>
            <p class="active-filter" id="active-filter">正在浏览全部记忆</p>
          </div>
          <div class="controls">
            <label class="search">
              <span>搜索</span>
              <input id="search-input" type="search" placeholder="地点 / 文件名 / 主题" />
            </label>
            <div class="chips" id="filter-chips" aria-label="分类筛选"></div>
          </div>
        </section>

        <section class="masonry gallery-panel" id="masonry" aria-live="polite" hidden></section>
      </main>
    </div>

    <dialog class="lightbox" id="lightbox">
      <button class="close-button" id="close-lightbox" type="button" aria-label="关闭">×</button>
      <div class="lightbox-media" id="lightbox-media"></div>
      <div class="lightbox-meta">
        <strong id="lightbox-title"></strong>
        <span id="lightbox-detail"></span>
      </div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
