<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>小田和小韩的时光入口</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="locked">
    <section class="auth-gate" id="auth-gate" aria-label="访问验证">
      <form class="auth-card" id="auth-form">
        <h1>小田和小韩的时光纪念册</h1>
        <label>
          <span>密码</span>
          <input id="password-input" type="password" autocomplete="current-password" placeholder="输入密码" required />
        </label>
        <button class="primary-button" type="submit">进入</button>
        <small id="auth-error" role="alert"></small>
      </form>
    </section>

    <div class="site-shell" id="site-shell" aria-hidden="true">
      <header class="hero" id="hero">
        <nav class="topbar">
          <a class="brand" href="#top" aria-label="回到顶部">时光纪念册</a>
          <div class="nav-actions">
            <a href="#timeline">时间线</a>
            <button id="nav-upload-button" type="button">上传照片</button>
            <button id="lock-button" type="button">锁定</button>
          </div>
        </nav>
        <section class="hero-inner" id="top">
          <h1>小田和小韩的时光纪念册</h1>
        </section>
      </header>

      <main>
        <section class="home-view">
          <section class="section-head timeline-head">
            <div class="timeline-title-block">
              <h2>时间线</h2>
            </div>
          </section>

          <section class="upload-panel" id="upload">
            <button class="upload-toggle" id="upload-toggle" type="button" aria-expanded="false">＋ 上传照片</button>
            <form id="local-album-form" class="local-album-form" hidden>
              <select id="upload-mode" aria-label="上传方式">
                <option value="new">新合集</option>
                <option value="existing">补充到已有合集</option>
              </select>
              <select id="existing-album" aria-label="选择合集" hidden></select>
              <input id="local-album-title" type="text" placeholder="合集名" required />
              <input id="local-album-date" type="date" />
              <input id="local-album-files" type="file" accept="image/*" multiple required />
              <button class="primary-button" type="submit">上传</button>
              <small class="upload-limits">一次最多 60 张，单张原图不超过 24MB</small>
              <small id="upload-status" aria-live="polite"></small>
            </form>
            <input id="quick-current-files" type="file" accept="image/*" multiple hidden />
          </section>

          <section class="timeline" id="timeline" aria-label="时间线"></section>

          <section class="toolbar gallery-panel" id="gallery" hidden>
            <div>
              <h2 id="gallery-title">选择一个合集</h2>
              <p class="active-filter" id="active-filter"></p>
            </div>
            <div class="gallery-actions">
              <button class="subtle-action" id="add-to-current-album" type="button" hidden>＋ 照片</button>
              <button class="subtle-action" id="delete-uploaded-album" type="button" hidden>删除合集</button>
            </div>
          </section>

          <section class="masonry gallery-panel" id="masonry" aria-live="polite" hidden></section>
        </section>
      </main>
    </div>

    <dialog class="lightbox" id="lightbox">
      <button class="close-button" id="close-lightbox" type="button" aria-label="关闭">×</button>
      <div class="lightbox-media" id="lightbox-media"></div>
      <div class="lightbox-meta">
        <strong id="lightbox-title"></strong>
        <span id="lightbox-detail"></span>
      </div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
