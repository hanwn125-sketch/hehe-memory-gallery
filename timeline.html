<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>小田和小韩的时光纪念册</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="locked">
    <section class="auth-gate" id="auth-gate" aria-label="访问验证">
      <form class="auth-card" id="auth-form">
        <div class="line-dog auth-dog" aria-hidden="true">
          <span class="dog-ear left"></span>
          <span class="dog-ear right"></span>
          <span class="dog-face"></span>
        </div>
        <h1>小田和小韩的时光纪念册</h1>
        <label>
          <span>密码</span>
          <input id="password-input" type="password" autocomplete="current-password" placeholder="输入密码" required />
        </label>
        <button class="primary-button" type="submit">进入</button>
        <small id="auth-error" role="alert"></small>
      </form>
    </section>

    <div class="site-shell" id="site-shell" aria-hidden="true">
      <header class="hero" id="hero">
        <nav class="topbar">
          <a class="brand" href="#top" aria-label="回到顶部">时光纪念册</a>
          <div class="nav-actions">
            <a href="index.html">首页</a>
            <a href="#timeline">时间线</a>
            <a href="food-map.html">美食地图</a>
            <button id="lock-button" type="button">锁定</button>
          </div>
        </nav>
        <section class="hero-inner" id="top">
          <div class="line-dog hero-dog" aria-hidden="true">
            <span class="dog-ear left"></span>
            <span class="dog-ear right"></span>
            <span class="dog-face"></span>
          </div>
          <h1>小田和小韩的时光纪念册</h1>
          <p class="hero-copy">慢慢翻。</p>
        </section>
      </header>

      <main>
        <section class="section-head timeline-head">
          <div class="timeline-title-block">
            <p class="eyebrow">时光轨迹</p>
            <h2>时间线</h2>
            <p>从第一次出发到后来的每一次见面，都按日期慢慢排好。</p>
          </div>
          <div class="timeline-stamps" aria-hidden="true">
            <span>按日期</span>
            <span>慢慢翻</span>
          </div>
        </section>

        <section class="upload-panel" id="upload">
          <button class="upload-toggle" id="upload-toggle" type="button" aria-expanded="false" hidden>＋ 新合集</button>
          <form id="local-album-form" class="local-album-form" hidden>
            <select id="upload-mode" aria-label="上传方式">
              <option value="new">新合集</option>
              <option value="existing">补充到已有合集</option>
            </select>
            <select id="existing-album" aria-label="选择合集" hidden></select>
            <input id="local-album-title" type="text" placeholder="合集名" required />
            <input id="local-album-date" type="date" />
            <input id="local-album-files" type="file" accept="image/*" multiple required />
            <button class="primary-button" type="submit">上传</button>
            <small id="upload-status" aria-live="polite"></small>
          </form>
          <input id="quick-album-files" type="file" accept="image/*" multiple hidden />
          <input id="quick-current-files" type="file" accept="image/*" multiple hidden />
        </section>

        <section class="timeline" id="timeline" aria-label="时间线"></section>

        <section class="toolbar gallery-panel" id="gallery" hidden>
          <div>
            <h2 id="gallery-title">选择一个合集</h2>
            <p class="active-filter" id="active-filter"></p>
          </div>
          <div class="gallery-actions">
            <button class="subtle-action" id="add-to-current-album" type="button" hidden>＋ 照片</button>
            <button class="subtle-action" id="delete-uploaded-album" type="button" hidden>删除合集</button>
          </div>
        </section>

        <section class="masonry gallery-panel" id="masonry" aria-live="polite" hidden></section>

        <section class="food-map" id="food-map" hidden>
          <div class="section-head food-head">
            <div>
              <h2>美食地图</h2>
              <p>直接在地图上点位置，记录店铺和好吃的菜。</p>
            </div>
            <a class="subtle-action" href="food-map.html">全屏打开</a>
          </div>
          <iframe class="embedded-food-map" src="food-map.html?embedded=1" title="天津美食地图录入面板"></iframe>
          <form class="food-form legacy-food-form" id="food-form" hidden>
            <input id="food-shop" type="text" placeholder="店名" required />
            <input id="food-place" type="text" placeholder="位置 / 城市" />
            <input id="food-dishes" type="text" placeholder="菜品，例如：海肠捞饭、烤鱼" />
            <select id="food-rating" aria-label="评分">
              <option value="5">想再去 5 分</option>
              <option value="4">很好吃 4 分</option>
              <option value="3">还不错 3 分</option>
            </select>
            <textarea id="food-note" rows="2" placeholder="一句回忆，比如：那天下雨，但这家热汤很舒服"></textarea>
            <button class="primary-button" type="submit">记一顿</button>
          </form>
          <div class="food-list legacy-food-list" id="food-list" aria-live="polite" hidden></div>
        </section>
      </main>
    </div>

    <dialog class="lightbox" id="lightbox">
      <button class="close-button" id="close-lightbox" type="button" aria-label="关闭">×</button>
      <div class="lightbox-media" id="lightbox-media"></div>
      <div class="lightbox-meta">
        <strong id="lightbox-title"></strong>
        <span id="lightbox-detail"></span>
      </div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
